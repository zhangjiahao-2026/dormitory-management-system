name: CI

on:
  push:
  pull_request:

jobs:
  ai-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: ai-service
      - run: pytest
        working-directory: ai-service
      - run: python evaluation/evaluate.py
        working-directory: ai-service

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - run: mvn --batch-mode test
        working-directory: Dormitory_business

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: vue/package-lock.json
      - run: npm ci
        working-directory: vue
      - run: npm run build
        working-directory: vue

# Local deployment profile. Uses an embedded H2 database so the project can run
# without installing MySQL on the host machine.
server.port=9091
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

spring.datasource.url=jdbc:h2:file:./data/dormitory;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.sql.init.continue-on-error=true

mybatis-plus.global-config.db-config.id-type=auto

file.upload-dir=${user.dir}/data/files/
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

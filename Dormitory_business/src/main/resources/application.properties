#Tomcat port
server.port=9091
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
#mysql
spring.datasource.url=jdbc:mysql://localhost:3306/dormitory?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8&useSSL=false
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
#file upload
file.upload-dir=${user.dir}/springboot/src/main/resources/files/
#file upload size limit
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB
# LLM fallback for Assistant: prefer environment variables in deployment.
# LLM_API_KEY=your-key
# LLM_BASE_URL=https://your-openai-compatible-host
# LLM_MODEL=your-model-name
# Independent AI repair service. Values may be supplied through environment variables.
ai.service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
ai.service.token=${AI_SERVICE_TOKEN:}
ai.service.connect-timeout-ms=${AI_SERVICE_CONNECT_TIMEOUT_MS:2000}
ai.service.read-timeout-ms=${AI_SERVICE_READ_TIMEOUT_MS:10000}
